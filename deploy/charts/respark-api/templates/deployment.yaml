apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "respark-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "respark-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "respark-api.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.waitForDatabase.enabled }}
      initContainers:
        - name: wait-for-database
          image: {{ .Values.waitForDatabase.image }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ required "waitForDatabase.host is required" .Values.waitForDatabase.host }} -p {{ .Values.waitForDatabase.port }}; do sleep 2; done
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
                optional: true
          {{- end }}
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
            {{- if .Values.debug.enabled }}
            - name: debug
              containerPort: {{ .Values.debug.port }}
            {{- end }}
          # Readiness only: a liveness probe would kill the pod while paused on a breakpoint.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          {{- include "respark-api.devVolumeMounts" . | nindent 10 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- include "respark-api.devVolumes" . | nindent 6 }}
