# Local development stack — Postgres + API + client + admin (watch mode).
#
#   task docker:up      # build + start
#   task docker:logs    # follow API + client + admin logs
#   task docker:down    # stop (keeps the DB volume)
#
# HUSKY=0 on app services. Dockerfiles also set it: compose env is not
# available during RUN npm ci, and workspace installs omit the husky binary.

services:
  db:
    # pgvector image so embeddings can be added later without swapping images
    image: pgvector/pgvector:pg17
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: respark
      POSTGRES_USER: respark
      POSTGRES_PASSWORD: respark
    volumes:
      - respark-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U respark -d respark']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - '${PORT:-3000}:3000'
      # Nest --debug listens here; attach with VS Code "API: attach (port 9229)"
      - '9229:9229'
    env_file:
      - path: apps/api/.env
        required: false
      - path: apps/api/.env.local
        required: false
    environment:
      PORT: '3000'
      NODE_ENV: development
      LOG_LEVEL: '${LOG_LEVEL:-debug}'
      HUSKY: '0'
      # Compose network hostname — overrides localhost from apps/api/.env
      DATABASE_URL: postgres://respark:respark@db:5432/respark
      # Apply drizzle/ on boot so a fresh volume is usable immediately
      RUN_MIGRATIONS: 'true'
      ETL_REPO_ROOT: /repo
      # Bedrock via IAM user respark-local-api keys in apps/api/.env.local
      # (`task api:local-aws:write`). Do not mount ~/.aws (that is the terraform user).
      CHAT_PROVIDER: ${CHAT_PROVIDER:-bedrock}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./package.json:/repo/package.json:ro
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/api/drizzle:/repo/apps/api/drizzle
      - ./apps/etl:/repo/apps/etl
      - ./packages/schemas:/repo/packages/schemas
      - ./packages/scryfall-query:/repo/packages/scryfall-query
    depends_on:
      db:
        condition: service_healthy
    command: ['npm', 'run', 'start:debug']

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile.dev
    ports:
      - '${CLIENT_PORT:-5173}:5173'
    env_file:
      - path: apps/client/.env
        required: false
      - path: apps/client/.env.local
        required: false
    environment:
      # Browser talks to the published API port on the host, not the Compose service name.
      VITE_API_URL: http://localhost:${PORT:-3000}
      HUSKY: '0'
    volumes:
      - ./apps/client/src:/repo/apps/client/src
      - ./apps/client/index.html:/repo/apps/client/index.html
      - ./apps/client/vite.config.ts:/repo/apps/client/vite.config.ts
      - ./packages/schemas:/repo/packages/schemas
      - ./packages/ui:/repo/packages/ui
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.dev
    ports:
      - '${ADMIN_PORT:-4000}:4000'
    env_file:
      - path: apps/admin/.env
        required: false
      - path: apps/admin/.env.local
        required: false
    environment:
      # Browser talks to the published API port on the host, not the Compose service name.
      VITE_API_URL: http://localhost:${PORT:-3000}
      HUSKY: '0'
    volumes:
      - ./apps/admin/src:/repo/apps/admin/src
      - ./apps/admin/index.html:/repo/apps/admin/index.html
      - ./apps/admin/vite.config.ts:/repo/apps/admin/vite.config.ts
      - ./packages/schemas:/repo/packages/schemas
      - ./packages/ui:/repo/packages/ui
    depends_on:
      - api

volumes:
  respark-db:
