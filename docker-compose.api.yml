# Local API container — see apps/api/README.md
services:
  db:
    # pgvector image so embeddings can be added later without swapping images
    image: pgvector/pgvector:pg17
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: respark
      POSTGRES_USER: respark
      POSTGRES_PASSWORD: respark
    volumes:
      - respark-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U respark -d respark"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
      # Uncomment for container debugging + VS Code "API: attach (port 9229)"
      # - "9229:9229"
    env_file:
      - path: apps/api/.env
        required: false
      - path: apps/api/.env.local
        required: false
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://respark:respark@db:5432/respark
    depends_on:
      db:
        condition: service_healthy
    # Uncomment with port 9229 above for inspect
    # command: ["node", "--inspect=0.0.0.0:9229", "dist/main.js"]

volumes:
  respark-db:
