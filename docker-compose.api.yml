# Local API container — see apps/api/README.md
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
      # Uncomment for container debugging + VS Code "API: attach (port 9229)"
      # - "9229:9229"
    env_file:
      - path: apps/api/.env
        required: false
      - path: apps/api/.env.local
        required: false
    environment:
      PORT: "3000"
    # Uncomment with port 9229 above for inspect
    # command: ["node", "--inspect=0.0.0.0:9229", "dist/main.js"]
