version: "3"

vars:
  ENV: develop
  TF_DIR: infra/envs/{{.ENV}}
  WEB_DIST: apps/web/dist
  API_PORT: "3000"
  API_DOCKERFILE: apps/api/Dockerfile
  API_IMAGE_TAG: latest
  AWS_REGION: us-east-1
  COMPOSE_FILE: docker-compose.api.yml

tasks:
  build:
    desc: Production build web app and API
    deps:
      - web:build
      - api:build

  web:build:
    desc: Production build of the React web app
    cmds:
      - npm run build:web

  api:build:
    desc: Compile the NestJS API
    cmds:
      - npm run build -w api

  db:up:
    desc: Start the local Postgres container and wait until it accepts connections
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --wait db

  db:down:
    desc: Stop the local Postgres container (data volume is preserved)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} stop db

  db:reset:
    desc: Destroy the local containers and the Postgres data volume
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down -v

  db:generate:
    desc: Generate a SQL migration from the Drizzle schema
    cmds:
      - npm run db:generate -w api

  db:migrate:
    desc: Apply pending migrations to the database in DATABASE_URL
    deps:
      - db:up
    cmds:
      - npm run db:migrate -w api

  db:studio:
    desc: Open Drizzle Studio against the local database
    cmds:
      - npm run db:studio -w api

  db:tunnel:
    desc: SSM port-forward localhost:15432 to develop RDS via the API EC2 instance
    env:
      AWS_REGION: "{{.AWS_REGION}}"
    cmds:
      - bash scripts/db-tunnel.sh

  db:url:
    desc: Print the develop RDS DATABASE_URL from SSM (contains the password)
    env:
      AWS_REGION: "{{.AWS_REGION}}"
    cmds:
      - |
        set -euo pipefail
        aws ssm get-parameter \
          --name "$(terraform -chdir={{.TF_DIR}} output -raw db_database_url_parameter)" \
          --with-decryption \
          --region "{{.AWS_REGION}}" \
          --query Parameter.Value \
          --output text

  api:dev:
    desc: Run the API in watch mode on PORT (default {{.API_PORT}})
    env:
      PORT: "{{.API_PORT}}"
    cmds:
      - npm run start:dev -w api

  api:debug:
    desc: Run the API with Node inspector on 9229 (or use VS Code "API debug (launch)")
    env:
      PORT: "{{.API_PORT}}"
    cmds:
      - npm run start:debug -w api

  api:start:
    desc: Run the compiled API (requires api:build)
    deps:
      - api:build
    cmds:
      - npm run start:prod -w api

  api:docker:build:
    desc: Build the API container image (linux/arm64 for Graviton)
    cmds:
      - docker build --platform linux/arm64 -f {{.API_DOCKERFILE}} -t respark-api:{{.API_IMAGE_TAG}} .

  api:docker:push:
    desc: Build and push the API image to ECR (requires infra applied)
    deps:
      - api:docker:build
    cmds:
      - |
        set -euo pipefail
        REPO=$(terraform -chdir={{.TF_DIR}} output -raw api_ecr_repository_url)
        REGISTRY="${REPO%%/*}"
        aws ecr get-login-password --region {{.AWS_REGION}} | docker login --username AWS --password-stdin "$REGISTRY"
        docker tag respark-api:{{.API_IMAGE_TAG}} "$REPO:{{.API_IMAGE_TAG}}"
        docker push "$REPO:{{.API_IMAGE_TAG}}"

  api:secrets:push:
    desc: Push CLERK_SECRET_KEY from apps/api/.env into SSM Parameter Store
    env:
      AWS_REGION: "{{.AWS_REGION}}"
    cmds:
      - bash scripts/push-api-secrets.sh

  api:deploy:ec2:
    desc: Pull latest image on the API EC2 instance via SSM and restart the container
    env:
      IMAGE_TAG: "{{.API_IMAGE_TAG}}"
      AWS_REGION: "{{.AWS_REGION}}"
    cmds:
      - bash scripts/redeploy-api-ec2.sh

  api:deploy:
    desc: Push API image to ECR and restart on EC2
    deps:
      - api:docker:push
    cmds:
      - task: api:deploy:ec2

  infra:plan:
    desc: Terraform plan for the {{.ENV}} environment
    dir: "{{.TF_DIR}}"
    cmds:
      - terraform init -input=false
      - terraform plan

  infra:apply:
    desc: Terraform apply for the {{.ENV}} environment
    dir: "{{.TF_DIR}}"
    cmds:
      - terraform init -input=false
      - terraform apply

  web:deploy:
    desc: Build against the deployed API, sync dist to S3, and invalidate CloudFront cache
    cmds:
      # VITE_API_URL must come from Terraform; without it the bundle would fall back to localhost.
      - |
        set -euo pipefail
        VITE_API_URL=$(terraform -chdir={{.TF_DIR}} output -raw api_url)
        echo "Building web against $VITE_API_URL"
        VITE_API_URL="$VITE_API_URL" npm run build:web
      - aws s3 sync {{.WEB_DIST}} s3://$(terraform -chdir={{.TF_DIR}} output -raw bucket_name) --delete
      - aws cloudfront create-invalidation --distribution-id $(terraform -chdir={{.TF_DIR}} output -raw cloudfront_distribution_id) --paths "/*"
