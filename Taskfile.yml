version: '3'

vars:
  # Override with ENV=production (or ENV=develop) — same for local and CI.
  ENV: develop
  TF_DIR: infra/envs/{{.ENV}}
  TF_PLAN_FILE: tfplan
  WEB_DIST: apps/web/dist
  ADMIN_DIST: apps/admin/dist
  API_PORT: '3000'
  API_DOCKERFILE: apps/api/Dockerfile
  API_IMAGE_TAG: latest
  AWS_REGION: us-east-1
  COMPOSE_FILE: docker-compose.yml
  # Set DOCKER_BUILDX=1 in CI to build+push linux/arm64 via buildx.
  DOCKER_BUILDX: '0'
  # Local interactive apply unless set (e.g. TF_APPLY_FLAGS=-auto-approve).
  TF_APPLY_FLAGS: ''

tasks:
  install:
    desc: Install JS workspace dependencies (npm ci)
    cmds:
      - npm ci

  format:
    desc: Format the repo (Prettier + terraform fmt)
    deps:
      - format:prettier
      - format:terraform

  format:check:
    desc: Check formatting without writing (Prettier + terraform fmt) — used in CI
    deps:
      - format:prettier:check
      - format:terraform:check

  format:staged:
    desc: Format staged files only (husky pre-commit via lint-staged)
    cmds:
      - npm run lint-staged

  format:prettier:
    desc: Write Prettier formatting across the repo
    cmds:
      - npm run prettier:write

  format:prettier:check:
    desc: Check Prettier formatting
    cmds:
      - npm run prettier:check

  format:terraform:
    desc: Write terraform fmt under infra/
    cmds:
      - terraform fmt -recursive infra/

  format:terraform:check:
    desc: Check terraform fmt under infra/
    cmds:
      - terraform fmt -check -recursive infra/

  lint:
    desc: Run ESLint + terraform validate
    deps:
      - lint:eslint
      - infra:validate

  lint:eslint:
    desc: Lint JS/TS with ESLint
    cmds:
      - npm run eslint

  precommit:
    desc: Format staged files, ESLint on staged files, terraform validate (husky)
    cmds:
      - task: format:staged
      - task: infra:validate

  build:
    desc: Production build etl, API, web, and admin
    deps:
      - schemas:build
      - etl:build
      - api:build
      - web:build
      - admin:build

  web:build:
    desc: Production build of the React web app (uses VITE_* from env / .env.local)
    deps:
      - schemas:build
    cmds:
      - npm run build:web

  admin:build:
    desc: Production build of the admin app (uses VITE_* from env / .env.local)
    deps:
      - schemas:build
    cmds:
      - npm run build:admin

  api:build:
    desc: Compile the NestJS API (depends on schemas:build and etl:build)
    deps:
      - schemas:build
      - etl:build
    cmds:
      - npm run build -w api

  docker:up:
    desc: Start local app stack via Docker Compose
    deps:
      - schemas:build
      - etl:build
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --build --wait

  docker:down:
    desc: Stop the local Compose stack (DB volume is preserved)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  docker:logs:
    desc: Follow local API + web + admin container logs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f api web admin

  docker:ps:
    desc: Show local Compose service status
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} ps

  db:up:
    desc: Start the local Postgres container and wait until it accepts connections
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --wait db

  db:down:
    desc: Stop the local Postgres container (data volume is preserved)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} stop db

  db:reset:
    desc: Destroy the local Compose stack and the Postgres data volume
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down -v

  db:generate:
    desc: Generate a SQL migration from the Drizzle schema
    cmds:
      - npm run db:generate -w api

  db:migrate:
    desc: Apply pending migrations to the database in DATABASE_URL
    deps:
      - db:up
    cmds:
      - npm run db:migrate -w api

  db:studio:
    desc: Open Drizzle Studio against the local database
    cmds:
      - npm run db:studio -w api

  etl:
    desc: 'Run the MTG ETL CLI (e.g. task etl -- ping | scryfall --limit 1000)'
    cmds:
      - npx tsx apps/etl/src/cli.ts {{.CLI_ARGS}}

  etl:build:
    desc: Compile the ETL CLI to apps/etl/dist
    cmds:
      - npm run build -w etl

  schemas:build:
    desc: Compile shared Zod wire schemas to packages/schemas/dist
    cmds:
      - npm run build -w schemas

  docs:diagrams:
    desc: Render docs/**/*.mmd Mermaid sources to sibling .svg files
    cmds:
      - |
        set -euo pipefail
        count=0
        for src in $(find docs -type f -name '*.mmd' | sort); do
          out="${src%.mmd}.svg"
          echo "mmdc $src → $out"
          npx --no-install mmdc -i "$src" -o "$out" -b transparent -t dark
          count=$((count + 1))
        done
        if [ "$count" -eq 0 ]; then
          echo "No .mmd files under docs/"
        fi

  db:tunnel:
    desc: SSM port-forward localhost:15432 to {{.ENV}} RDS via the API EC2 instance
    env:
      AWS_REGION: '{{.AWS_REGION}}'
      ENV: '{{.ENV}}'
      TF_DIR: '{{.TF_DIR}}'
    cmds:
      - bash scripts/db-tunnel.sh

  db:url:
    desc: Print the {{.ENV}} RDS DATABASE_URL from SSM (contains the password)
    env:
      AWS_REGION: '{{.AWS_REGION}}'
    cmds:
      - |
        set -euo pipefail
        aws ssm get-parameter \
          --name "$(terraform -chdir={{.TF_DIR}} output -raw db_database_url_parameter)" \
          --with-decryption \
          --region "{{.AWS_REGION}}" \
          --query Parameter.Value \
          --output text

  api:dev:
    desc: Run the API in watch mode on PORT (default {{.API_PORT}})
    deps:
      - schemas:build
      - etl:build
    env:
      PORT: '{{.API_PORT}}'
    cmds:
      - npm run start:dev -w api

  admin:dev:
    desc: Run the admin Vite app on port 4000
    cmds:
      - npm run dev -w admin

  api:debug:
    desc: Run the API with Node inspector on 9229 (or use VS Code "API debug (launch)")
    deps:
      - schemas:build
      - etl:build
    env:
      PORT: '{{.API_PORT}}'
    cmds:
      - npm run start:debug -w api

  api:start:
    desc: Run the compiled API (requires api:build)
    deps:
      - api:build
    cmds:
      - npm run start:prod -w api

  api:docker:build:
    desc: Build the API container image (linux/arm64 for Graviton)
    cmds:
      - docker build --platform linux/arm64 -f {{.API_DOCKERFILE}} -t respark-api:{{.API_IMAGE_TAG}} .

  api:docker:push:
    desc: Build and push the API image to ECR for {{.ENV}} (set DOCKER_BUILDX=1 in CI)
    cmds:
      - |
        set -euo pipefail
        REPO=$(terraform -chdir={{.TF_DIR}} output -raw api_ecr_repository_url)
        REGISTRY="${REPO%%/*}"
        aws ecr get-login-password --region {{.AWS_REGION}} | docker login --username AWS --password-stdin "$REGISTRY"
        if [ "{{.DOCKER_BUILDX}}" = "1" ]; then
          docker buildx build \
            --platform linux/arm64 \
            -f {{.API_DOCKERFILE}} \
            --tag "$REPO:{{.API_IMAGE_TAG}}" \
            --tag "$REPO:latest" \
            --push \
            .
        else
          docker build --platform linux/arm64 -f {{.API_DOCKERFILE}} -t respark-api:{{.API_IMAGE_TAG}} .
          docker tag respark-api:{{.API_IMAGE_TAG}} "$REPO:{{.API_IMAGE_TAG}}"
          docker tag respark-api:{{.API_IMAGE_TAG}} "$REPO:latest"
          docker push "$REPO:{{.API_IMAGE_TAG}}"
          docker push "$REPO:latest"
        fi

  api:secrets:push:
    desc: Push CLERK_SECRET_KEY from apps/api/.env into SSM for {{.ENV}}
    env:
      AWS_REGION: '{{.AWS_REGION}}'
      ENV: '{{.ENV}}'
      TF_DIR: '{{.TF_DIR}}'
    cmds:
      - bash scripts/push-api-secrets.sh

  api:deploy:ec2:
    desc: Pull latest image on the API EC2 instance via SSM and restart the container
    env:
      IMAGE_TAG: '{{.API_IMAGE_TAG}}'
      AWS_REGION: '{{.AWS_REGION}}'
      ENV: '{{.ENV}}'
      TF_DIR: '{{.TF_DIR}}'
    cmds:
      - bash scripts/redeploy-api-ec2.sh

  api:deploy:
    desc: Push API image to ECR and restart on EC2 ({{.ENV}})
    cmds:
      - task: api:docker:push
      - task: api:deploy:ec2

  infra:init:
    desc: Terraform init for {{.ENV}}
    dir: '{{.TF_DIR}}'
    cmds:
      - terraform init -input=false

  infra:validate:
    desc: Terraform validate for {{.ENV}} (local init, no remote backend — safe for hooks/CI without AWS)
    dir: '{{.TF_DIR}}'
    cmds:
      - terraform init -backend=false -input=false
      - terraform validate

  infra:plan:
    desc: Terraform plan for {{.ENV}} (writes {{.TF_PLAN_FILE}}; fmt/validate via format:check + infra:validate)
    dir: '{{.TF_DIR}}'
    cmds:
      - terraform init -input=false
      - terraform plan -input=false -out={{.TF_PLAN_FILE}}

  infra:apply:
    desc: Terraform apply for {{.ENV}} (uses {{.TF_PLAN_FILE}} when present)
    dir: '{{.TF_DIR}}'
    cmds:
      - terraform init -input=false
      - |
        set -euo pipefail
        if [ -f "{{.TF_PLAN_FILE}}" ]; then
          terraform apply -input=false -auto-approve "{{.TF_PLAN_FILE}}"
        else
          # Local: interactive unless TF_APPLY_FLAGS=-auto-approve
          terraform apply {{.TF_APPLY_FLAGS}}
        fi

  deploy:ui:
    desc: Deploy web and admin in parallel for {{.ENV}}
    deps:
      - web:deploy
      - admin:deploy

  deploy:
    desc: Apply Terraform for {{.ENV}}, deploy API, then web+admin in parallel
    cmds:
      - task: infra:apply
      - task: api:deploy
      - task: deploy:ui

  web:deploy:
    desc: Build against the deployed API, sync dist to S3, and invalidate CloudFront ({{.ENV}})
    cmds:
      # VITE_API_URL from Terraform; VITE_CLERK_PUBLISHABLE_KEY from the GitHub
      # Environment variable (CI) or apps/web/.env.local (local Vite loadEnv).
      - |
        set -euo pipefail
        if [[ -n "${GITHUB_ACTIONS:-}" && -z "${VITE_CLERK_PUBLISHABLE_KEY:-}" ]]; then
          echo "VITE_CLERK_PUBLISHABLE_KEY is required in CI. Add it as a GitHub Environment variable on '{{.ENV}}'." >&2
          exit 1
        fi
        VITE_API_URL=$(terraform -chdir={{.TF_DIR}} output -raw api_url)
        echo "Building web against $VITE_API_URL (env={{.ENV}})"
        VITE_API_URL="$VITE_API_URL" npm run build:web
      - aws s3 sync {{.WEB_DIST}} s3://$(terraform -chdir={{.TF_DIR}} output -raw bucket_name) --delete
      - aws cloudfront create-invalidation --distribution-id $(terraform -chdir={{.TF_DIR}} output -raw cloudfront_distribution_id) --paths "/*"

  admin:deploy:
    desc: Build admin against the deployed API, sync dist to S3, and invalidate CloudFront ({{.ENV}})
    cmds:
      - |
        set -euo pipefail
        if [[ -n "${GITHUB_ACTIONS:-}" && -z "${VITE_CLERK_PUBLISHABLE_KEY:-}" ]]; then
          echo "VITE_CLERK_PUBLISHABLE_KEY is required in CI. Add it as a GitHub Environment variable on '{{.ENV}}'." >&2
          exit 1
        fi
        VITE_API_URL=$(terraform -chdir={{.TF_DIR}} output -raw api_url)
        echo "Building admin against $VITE_API_URL (env={{.ENV}})"
        VITE_API_URL="$VITE_API_URL" npm run build:admin
      - aws s3 sync {{.ADMIN_DIST}} s3://$(terraform -chdir={{.TF_DIR}} output -raw admin_bucket_name) --delete
      - aws cloudfront create-invalidation --distribution-id $(terraform -chdir={{.TF_DIR}} output -raw admin_cloudfront_distribution_id) --paths "/*"
