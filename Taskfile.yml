version: '3'

vars:
  # Override with ENV=production (or ENV=develop) — same for local and CI.
  ENV: develop
  TF_DIR: infra/envs/{{.ENV}}
  TF_PLAN_FILE: tfplan
  CLIENT_DIST: apps/client/dist
  ADMIN_DIST: apps/admin/dist
  API_PORT: '3000'
  API_DOCKERFILE: apps/api/Dockerfile
  API_IMAGE_TAG: latest
  AWS_REGION: us-east-1
  COMPOSE_FILE: docker-compose.yml
  # Local stack runs on Docker Desktop's built-in Kubernetes (kubeadm mode).
  K8S_CONTEXT: docker-desktop
  K8S_NAMESPACE: respark
  K8S_LOCAL_VALUES: deploy/envs/local
  TRAEFIK_CHART_VERSION: 41.6.0
  # Set DOCKER_BUILDX=1 in CI to build+push linux/arm64 via buildx (native on ubuntu-24.04-arm).
  DOCKER_BUILDX: '0'
  # Local interactive apply unless set (e.g. TF_APPLY_FLAGS=-auto-approve).
  TF_APPLY_FLAGS: ''

tasks:
  install:
    desc: Install JS workspace dependencies (npm ci)
    cmds:
      - npm ci

  format:
    desc: Format the repo (Prettier + terraform fmt)
    deps:
      - format:prettier
      - format:terraform

  format:check:
    desc: Check formatting without writing (Prettier + terraform fmt)
    deps:
      - format:prettier:check
      - format:terraform:check

  format:staged:
    desc: Format staged files only (husky pre-commit via lint-staged)
    cmds:
      - npm run lint-staged

  format:prettier:
    desc: Write Prettier formatting across the repo
    cmds:
      - npm run prettier:write

  format:prettier:check:
    desc: Check Prettier formatting
    cmds:
      - npm run prettier:check

  format:terraform:
    desc: Write terraform fmt under infra/
    cmds:
      - terraform fmt -recursive infra/

  format:terraform:check:
    desc: Check terraform fmt under infra/
    cmds:
      - terraform fmt -check -recursive infra/

  lint:
    desc: Run ESLint + terraform validate + helm lint
    deps:
      - lint:eslint
      - infra:validate
      - k8s:lint

  lint:eslint:
    desc: Lint JS/TS with ESLint
    cmds:
      - npm run eslint

  test:
    desc: Run unit tests (etl node:test + api Vitest / chat evals + scryfall-query)
    deps:
      - schemas:build
      - scryfall-query:build
    cmds:
      - npm test -w etl
      - npm test -w @respark/scryfall-query
      - npm test -w api

  precommit:
    desc: Format staged files, ESLint on staged files, terraform validate (husky)
    cmds:
      - task: format:staged
      - task: infra:validate

  commit:
    desc: Interactive Conventional Commit (Commitizen)
    interactive: true
    cmds:
      - npx cz

  commitlint:
    desc: Lint commit messages from BASE (default origin/main) to TO (default HEAD)
    vars:
      BASE: origin/main
      TO: HEAD
    cmds:
      - npx commitlint --from {{.BASE}} --to {{.TO}} --verbose

  commitlint:title:
    desc: Lint a commit message from stdin (PR titles in CI)
    cmds:
      - npx commitlint

  release:
    desc: Bump platform version, changelog, tag, and GitHub Release (CI on main)
    cmds:
      - node scripts/release.mjs {{.CLI_ARGS}}

  build:
    desc: Production build etl, API, client, and admin
    deps:
      - schemas:build
      - ui:build
      - etl:build
      - api:build
      - client:build
      - admin:build

  client:build:
    desc: Production build of the React client app (uses VITE_* from env / .env.local)
    deps:
      - schemas:build
      - ui:build
    cmds:
      - npm run build:client

  admin:build:
    desc: Production build of the admin app (uses VITE_* from env / .env.local)
    deps:
      - schemas:build
      - ui:build
    cmds:
      - npm run build:admin

  api:build:
    desc: Compile the NestJS API (depends on schemas:build, scryfall-query:build, and etl:build)
    deps:
      - schemas:build
      - scryfall-query:build
      - etl:build
    cmds:
      - npm run build -w api

  k8s:check:
    desc: Fail unless kubectl targets Docker Desktop's local Kubernetes
    run: once
    silent: true
    cmds:
      - |
        set -euo pipefail
        ctx="$(kubectl config current-context 2>/dev/null || true)"
        if [ "$ctx" != "{{.K8S_CONTEXT}}" ]; then
          echo "kubectl context is '${ctx:-<none>}', expected '{{.K8S_CONTEXT}}'." >&2
          echo "Enable Kubernetes in Docker Desktop, then: kubectl config use-context {{.K8S_CONTEXT}}" >&2
          exit 1
        fi
        if ! kubectl get node docker-desktop >/dev/null 2>&1; then
          echo "No 'docker-desktop' node. Use Docker Desktop's kubeadm cluster; kind mode cannot see locally built images." >&2
          exit 1
        fi

  k8s:up:
    desc: Start the local stack on Docker Desktop Kubernetes (Traefik + Postgres + API + client + admin)
    cmds:
      - task: k8s:check
      - task: k8s:ingress
      - task: k8s:sync

  k8s:sync:
    desc: Rebuild local images, refresh Secrets from .env files, and roll out the app releases
    cmds:
      - task: k8s:check
      - task: k8s:images
      - task: k8s:secrets
      - task: db:up
      - task: k8s:deploy

  k8s:ingress:
    desc: Install the Traefik ingress controller into the local cluster
    cmds:
      - task: k8s:check
      - >-
        helm upgrade --install traefik traefik
        --repo https://traefik.github.io/charts
        --version {{.TRAEFIK_CHART_VERSION}}
        --namespace traefik --create-namespace --wait

  k8s:images:
    desc: Build the local dev images into Docker Desktop's image store
    deps:
      - schemas:build
      - scryfall-query:build
      - ui:build
      - etl:build
    cmds:
      - docker build -f apps/api/Dockerfile.dev -t respark-api-dev:local .
      - docker build -f apps/client/Dockerfile.dev -t respark-client-dev:local .
      - docker build -f apps/admin/Dockerfile.dev -t respark-admin-dev:local .

  k8s:secrets:
    desc: Load apps/*/.env + .env.local into local cluster Secrets (re-run k8s:sync after editing them)
    env:
      K8S_NAMESPACE: '{{.K8S_NAMESPACE}}'
    cmds:
      - task: k8s:check
      - bash scripts/k8s-local-secrets.sh

  k8s:deploy:
    internal: true
    vars:
      # Changes on every run so pods restart onto the freshly built :local images.
      RESTARTED_AT:
        sh: date +%s
    cmds:
      - task: k8s:check
      - >-
        helm upgrade --install respark-api deploy/charts/respark-api
        --namespace {{.K8S_NAMESPACE}} -f {{.K8S_LOCAL_VALUES}}/api.yaml
        --set-string podAnnotations.respark/restarted-at={{.RESTARTED_AT}}
        --set-string repoRoot={{.ROOT_DIR}} --wait
      - >-
        helm upgrade --install respark-client deploy/charts/respark-web
        --namespace {{.K8S_NAMESPACE}} -f {{.K8S_LOCAL_VALUES}}/client.yaml
        --set-string podAnnotations.respark/restarted-at={{.RESTARTED_AT}}
        --set-string repoRoot={{.ROOT_DIR}} --wait
      - >-
        helm upgrade --install respark-admin deploy/charts/respark-web
        --namespace {{.K8S_NAMESPACE}} -f {{.K8S_LOCAL_VALUES}}/admin.yaml
        --set-string podAnnotations.respark/restarted-at={{.RESTARTED_AT}}
        --set-string repoRoot={{.ROOT_DIR}} --wait

  k8s:down:
    desc: Remove the local app releases (Postgres data volume is preserved)
    cmds:
      - task: k8s:check
      - >-
        helm uninstall respark-admin respark-client respark-api respark-postgres
        --namespace {{.K8S_NAMESPACE}} --ignore-not-found

  k8s:logs:
    desc: Follow local API + client + admin pod logs
    cmds:
      - task: k8s:check
      - >-
        kubectl logs -f --namespace {{.K8S_NAMESPACE}}
        -l 'app.kubernetes.io/name in (respark-api,respark-web)'
        --all-containers --prefix --max-log-requests 10

  k8s:ps:
    desc: Show local pods, services, and ingresses
    cmds:
      - task: k8s:check
      - kubectl get pods,svc,ingress --namespace {{.K8S_NAMESPACE}}

  k8s:lint:
    desc: Lint the Helm charts against the local values
    cmds:
      - helm lint deploy/charts/respark-postgres -f {{.K8S_LOCAL_VALUES}}/postgres.yaml
      - helm lint deploy/charts/respark-api -f {{.K8S_LOCAL_VALUES}}/api.yaml --set-string repoRoot={{.ROOT_DIR}}
      - helm lint deploy/charts/respark-web -f {{.K8S_LOCAL_VALUES}}/client.yaml --set-string repoRoot={{.ROOT_DIR}}
      - helm lint deploy/charts/respark-web -f {{.K8S_LOCAL_VALUES}}/admin.yaml --set-string repoRoot={{.ROOT_DIR}}

  docker:up:
    desc: 'Deprecated: start the old Docker Compose stack (use k8s:up)'
    deps:
      - schemas:build
      - scryfall-query:build
      - ui:build
      - etl:build
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --build --wait

  docker:down:
    desc: 'Deprecated: stop the old Compose stack (use k8s:down)'
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  docker:logs:
    desc: 'Deprecated: follow Compose logs (use k8s:logs)'
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f api client admin

  docker:ps:
    desc: 'Deprecated: show Compose status (use k8s:ps)'
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} ps

  db:up:
    desc: Install/start local Postgres on Docker Desktop Kubernetes and wait until it accepts connections
    cmds:
      - task: k8s:check
      - >-
        helm upgrade --install respark-postgres deploy/charts/respark-postgres
        --namespace {{.K8S_NAMESPACE}} --create-namespace
        -f {{.K8S_LOCAL_VALUES}}/postgres.yaml --wait

  db:down:
    desc: Stop local Postgres (data volume is preserved)
    cmds:
      - task: k8s:check
      - helm uninstall respark-postgres --namespace {{.K8S_NAMESPACE}} --ignore-not-found

  db:reset:
    desc: Remove the local stack and delete the Postgres data volume
    cmds:
      - task: k8s:down
      - kubectl delete pvc data-respark-postgres-0 --namespace {{.K8S_NAMESPACE}} --ignore-not-found

  db:generate:
    desc: Generate a SQL migration from the Drizzle schema
    cmds:
      - npm run db:generate -w api

  db:migrate:
    desc: Apply pending migrations to the database in DATABASE_URL
    deps:
      - db:up
    cmds:
      - npm run db:migrate -w api

  db:studio:
    desc: Open Drizzle Studio against the local database
    cmds:
      - npm run db:studio -w api

  etl:
    desc: 'Run the MTG ETL CLI (e.g. task etl -- ping | scryfall --limit 1000)'
    cmds:
      - npx tsx apps/etl/src/cli.ts {{.CLI_ARGS}}

  etl:build:
    desc: Compile the ETL CLI to apps/etl/dist
    deps:
      - schemas:build
    cmds:
      - npm run build -w etl

  schemas:build:
    desc: Compile shared Zod wire schemas to packages/schemas/dist
    cmds:
      - npm run build -w @respark/schemas

  scryfall-query:build:
    desc: Compile packages/scryfall-query
    cmds:
      - npm run build -w @respark/scryfall-query

  scryfall-query:test:
    desc: Run scryfall-query unit tests
    cmds:
      - npm run test -w @respark/scryfall-query

  ui:build:
    desc: Compile shared UI package to packages/ui/dist
    cmds:
      - npm run build -w @respark/ui

  schemas:ci:
    desc: Format-check, lint, and build packages/schemas
    cmds:
      - npx prettier --check packages/schemas
      - npx eslint packages/schemas
      - task: schemas:build

  ui:ci:
    desc: Format-check, lint, and build packages/ui
    cmds:
      - npx prettier --check packages/ui
      - npx eslint packages/ui
      - task: ui:build

  etl:ci:
    desc: Format-check, lint, test, and build the ETL CLI
    cmds:
      - npx prettier --check apps/etl
      - npx eslint apps/etl
      - task: schemas:build
      - npm test -w etl
      - task: etl:build

  api:ci:
    desc: Format-check, lint, test, and build the API
    cmds:
      - npx prettier --check apps/api scripts/redeploy-api-ec2.sh scripts/push-api-secrets.sh
      - npx eslint apps/api
      - task: schemas:build
      - task: scryfall-query:build
      - npm test -w @respark/scryfall-query
      - npm test -w api
      - task: api:build

  client:ci:
    desc: Format-check, lint, and production-build the client
    cmds:
      - npx prettier --check apps/client
      - npx eslint apps/client
      - task: client:build

  admin:ci:
    desc: Format-check, lint, and production-build the admin app
    cmds:
      - npx prettier --check apps/admin
      - npx eslint apps/admin
      - task: admin:build

  infra:ci:
    desc: Format-check and validate Terraform (plan stays in CI with OIDC)
    deps:
      - format:terraform:check
      - infra:validate

  shared:ci:
    desc: Format-check and lint repo-root, docs, scripts, and Helm charts
    cmds:
      - |
        npx prettier --check . \
          --ignore-path .gitignore \
          --ignore-path .prettierignore \
          --ignore-path .prettierignore.shared
      - npx eslint scripts commitlint.config.mjs eslint.config.mjs
      - task: k8s:lint

  docs:diagrams:
    desc: Render docs/**/*.mmd Mermaid sources to sibling .svg files
    cmds:
      - |
        set -euo pipefail
        count=0
        for src in $(find docs -type f -name '*.mmd' | sort); do
          out="${src%.mmd}.svg"
          echo "mmdc $src → $out"
          npx --no-install mmdc -i "$src" -o "$out" -b transparent -t dark
          count=$((count + 1))
        done
        if [ "$count" -eq 0 ]; then
          echo "No .mmd files under docs/"
        fi

  db:tunnel:
    desc: SSM port-forward localhost:15432 to {{.ENV}} RDS via the API EC2 instance
    env:
      AWS_REGION: '{{.AWS_REGION}}'
      ENV: '{{.ENV}}'
      TF_DIR: '{{.TF_DIR}}'
    cmds:
      - bash scripts/db-tunnel.sh

  db:url:
    desc: Print the {{.ENV}} RDS DATABASE_URL from SSM (contains the password)
    env:
      AWS_REGION: '{{.AWS_REGION}}'
    cmds:
      - |
        set -euo pipefail
        aws ssm get-parameter \
          --name "$(terraform -chdir={{.TF_DIR}} output -raw db_database_url_parameter)" \
          --with-decryption \
          --region "{{.AWS_REGION}}" \
          --query Parameter.Value \
          --output text

  db:purge-non-playable:
    desc: Delete catalog/raw extras (tokens, art, planes, …) ({{.ENV}} via tunnel; dry-run unless -- apply)
    env:
      AWS_REGION: '{{.AWS_REGION}}'
      ENV: '{{.ENV}}'
      TF_DIR: '{{.TF_DIR}}'
    cmds:
      - bash scripts/purge-non-playable-cards.sh {{.CLI_ARGS}}

  db:purge-digital:
    desc: Delete digital-only sets/printings ({{.ENV}} via tunnel; dry-run unless -- apply)
    env:
      AWS_REGION: '{{.AWS_REGION}}'
      ENV: '{{.ENV}}'
      TF_DIR: '{{.TF_DIR}}'
    cmds:
      - bash scripts/purge-digital-sets.sh {{.CLI_ARGS}}

  api:dev:
    desc: Run the API in watch mode on PORT (default {{.API_PORT}})
    deps:
      - schemas:build
      - scryfall-query:build
      - etl:build
    env:
      PORT: '{{.API_PORT}}'
    cmds:
      - npm run start:dev -w api

  admin:dev:
    desc: Run the admin Vite app on port 4000
    cmds:
      - npm run dev -w @respark/admin

  api:debug:
    desc: Run the API with Node inspector on 9229 (or use VS Code "API debug (launch)")
    deps:
      - schemas:build
      - scryfall-query:build
      - etl:build
    env:
      PORT: '{{.API_PORT}}'
    cmds:
      - npm run start:debug -w api

  api:start:
    desc: Run the compiled API (requires api:build)
    deps:
      - api:build
    cmds:
      - npm run start:prod -w api

  api:docker:build:
    desc: Build the API container image (linux/arm64 for Graviton)
    cmds:
      - docker build --platform linux/arm64 -f {{.API_DOCKERFILE}} -t respark-api:{{.API_IMAGE_TAG}} .

  api:docker:push:
    desc: Build and push the API image to ECR for {{.ENV}} (set DOCKER_BUILDX=1 in CI)
    cmds:
      - |
        set -euo pipefail
        REPO=$(terraform -chdir={{.TF_DIR}} output -raw api_ecr_repository_url)
        REGISTRY="${REPO%%/*}"
        aws ecr get-login-password --region {{.AWS_REGION}} | docker login --username AWS --password-stdin "$REGISTRY"
        if [ "{{.DOCKER_BUILDX}}" = "1" ]; then
          docker buildx build \
            --platform linux/arm64 \
            -f {{.API_DOCKERFILE}} \
            --tag "$REPO:{{.API_IMAGE_TAG}}" \
            --tag "$REPO:latest" \
            --push \
            .
        else
          docker build --platform linux/arm64 -f {{.API_DOCKERFILE}} -t respark-api:{{.API_IMAGE_TAG}} .
          docker tag respark-api:{{.API_IMAGE_TAG}} "$REPO:{{.API_IMAGE_TAG}}"
          docker tag respark-api:{{.API_IMAGE_TAG}} "$REPO:latest"
          docker push "$REPO:{{.API_IMAGE_TAG}}"
          docker push "$REPO:latest"
        fi

  api:secrets:push:
    desc: Push CLERK_SECRET_KEY from apps/api/.env into SSM for {{.ENV}}
    env:
      AWS_REGION: '{{.AWS_REGION}}'
      ENV: '{{.ENV}}'
      TF_DIR: '{{.TF_DIR}}'
    cmds:
      - bash scripts/push-api-secrets.sh

  api:local-aws:write:
    desc: Write respark-local-api access keys into apps/api/.env.local (apply ENV=local first)
    env:
      AWS_REGION: '{{.AWS_REGION}}'
      TF_DIR: infra/envs/local
    cmds:
      - bash scripts/write-local-api-aws-creds.sh {{.CLI_ARGS}}

  api:deploy:ec2:
    desc: Pull latest image on the API EC2 instance via SSM and restart the container
    env:
      IMAGE_TAG: '{{.API_IMAGE_TAG}}'
      AWS_REGION: '{{.AWS_REGION}}'
      ENV: '{{.ENV}}'
      TF_DIR: '{{.TF_DIR}}'
    cmds:
      - bash scripts/redeploy-api-ec2.sh

  api:deploy:
    desc: Push API image to ECR and restart on EC2 ({{.ENV}})
    cmds:
      - task: api:docker:push
      - task: api:deploy:ec2

  infra:init:
    desc: Terraform init for {{.ENV}}
    dir: '{{.TF_DIR}}'
    cmds:
      - terraform init -input=false

  infra:validate:
    desc: Terraform validate all env roots (local init, no remote backend — safe for hooks/CI without AWS)
    cmds:
      - |
        set -euo pipefail
        for dir in infra/envs/*/; do
          echo "terraform validate ${dir}"
          terraform -chdir="$dir" validate
        done

  infra:plan:
    desc: Terraform plan for {{.ENV}} (writes {{.TF_PLAN_FILE}}; fmt/validate via format:check + infra:validate)
    dir: '{{.TF_DIR}}'
    cmds:
      - terraform init -input=false
      - terraform plan -input=false -out={{.TF_PLAN_FILE}}

  infra:apply:
    desc: Terraform apply for {{.ENV}} (uses {{.TF_PLAN_FILE}} when present)
    dir: '{{.TF_DIR}}'
    cmds:
      - terraform init -input=false
      - |
        set -euo pipefail
        if [ -f "{{.TF_PLAN_FILE}}" ]; then
          terraform apply -input=false -auto-approve "{{.TF_PLAN_FILE}}"
        else
          # Local: interactive unless TF_APPLY_FLAGS=-auto-approve
          terraform apply {{.TF_APPLY_FLAGS}}
        fi

  deploy:ui:
    desc: Deploy client and admin in parallel for {{.ENV}}
    deps:
      - client:deploy
      - admin:deploy

  deploy:
    desc: Apply Terraform for {{.ENV}}, deploy API, then client+admin in parallel
    cmds:
      - task: infra:apply
      - task: api:deploy
      - task: deploy:ui

  client:deploy:
    desc: Build against the deployed API, sync dist to S3, and invalidate CloudFront ({{.ENV}})
    cmds:
      # VITE_API_URL from Terraform; VITE_CLERK_PUBLISHABLE_KEY from the GitHub
      # Environment variable (CI) or apps/client/.env.local (local Vite loadEnv).
      - |
        set -euo pipefail
        if [[ -n "${GITHUB_ACTIONS:-}" && -z "${VITE_CLERK_PUBLISHABLE_KEY:-}" ]]; then
          echo "VITE_CLERK_PUBLISHABLE_KEY is required in CI. Add it as a GitHub Environment variable on '{{.ENV}}'." >&2
          exit 1
        fi
        VITE_API_URL=$(terraform -chdir={{.TF_DIR}} output -raw api_url)
        echo "Building client against $VITE_API_URL (env={{.ENV}})"
        VITE_API_URL="$VITE_API_URL" npm run build:client
      - aws s3 sync {{.CLIENT_DIST}} s3://$(terraform -chdir={{.TF_DIR}} output -raw bucket_name) --delete
      - aws cloudfront create-invalidation --distribution-id $(terraform -chdir={{.TF_DIR}} output -raw cloudfront_distribution_id) --paths "/*"

  admin:deploy:
    desc: Build admin against the deployed API, sync dist to S3, and invalidate CloudFront ({{.ENV}})
    cmds:
      - |
        set -euo pipefail
        if [[ -n "${GITHUB_ACTIONS:-}" && -z "${VITE_CLERK_PUBLISHABLE_KEY:-}" ]]; then
          echo "VITE_CLERK_PUBLISHABLE_KEY is required in CI. Add it as a GitHub Environment variable on '{{.ENV}}'." >&2
          exit 1
        fi
        VITE_API_URL=$(terraform -chdir={{.TF_DIR}} output -raw api_url)
        echo "Building admin against $VITE_API_URL (env={{.ENV}})"
        VITE_API_URL="$VITE_API_URL" npm run build:admin
      - aws s3 sync {{.ADMIN_DIST}} s3://$(terraform -chdir={{.TF_DIR}} output -raw admin_bucket_name) --delete
      - aws cloudfront create-invalidation --distribution-id $(terraform -chdir={{.TF_DIR}} output -raw admin_cloudfront_distribution_id) --paths "/*"
