name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (must match infra/envs/<name> and a GitHub Environment)
        type: choice
        options:
          - develop
          - production
        default: develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.environment || 'develop' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '22'
  TERRAFORM_VERSION: '1.9.8'
  TASK_VERSION: '3.x'

jobs:
  config:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
      deploy: ${{ steps.set.outputs.deploy }}
      force: ${{ steps.set.outputs.force }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
            # Manual runs always rebuild/redeploy everything for the chosen env.
            FORCE=true
          else
            # PRs and pushes to main always target develop.
            ENV="develop"
            FORCE=false
          fi

          DEPLOY=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] && {
            [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]
          }; then
            DEPLOY=true
          fi

          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
          echo "deploy=${DEPLOY}" >> "$GITHUB_OUTPUT"
          echo "force=${FORCE}" >> "$GITHUB_OUTPUT"
          echo "Resolved ENV=${ENV} deploy=${DEPLOY} force=${FORCE}"

  changes:
    name: Detect changes
    needs: [config]
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.flags.outputs.shared }}
      schemas: ${{ steps.flags.outputs.schemas }}
      ui: ${{ steps.flags.outputs.ui }}
      etl: ${{ steps.flags.outputs.etl }}
      api: ${{ steps.flags.outputs.api }}
      client: ${{ steps.flags.outputs.client }}
      admin: ${{ steps.flags.outputs.admin }}
      infra: ${{ steps.flags.outputs.infra }}
      deploy_api: ${{ steps.flags.outputs.deploy_api }}
      deploy_client: ${{ steps.flags.outputs.deploy_client }}
      deploy_admin: ${{ steps.flags.outputs.deploy_admin }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - id: ref
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: dorny/paths-filter@v3
        id: filter
        if: needs.config.outputs.force != 'true'
        with:
          filters: |
            shared:
              - 'docs/**'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'AGENTS.md'
              - 'TODO.md'
              - '.github/**'
              - '.husky/**'
              - 'commitlint.config.mjs'
              - 'docker-compose.yml'
              - 'tech-debt-analysis-prompt.md'
              - '.prettierignore.shared'
              - 'scripts/**'
              - '!scripts/redeploy-api-ec2.sh'
              - '!scripts/push-api-secrets.sh'
            toolchain:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'Taskfile.yml'
              - 'eslint.config.mjs'
              - '.prettierrc.json'
              - '.prettierignore'
            schemas:
              - 'packages/schemas/**'
            ui:
              - 'packages/ui/**'
            etl:
              - 'apps/etl/**'
            api:
              - 'apps/api/**'
              - 'scripts/redeploy-api-ec2.sh'
              - 'scripts/push-api-secrets.sh'
            client:
              - 'apps/client/**'
            admin:
              - 'apps/admin/**'
            infra:
              - 'infra/**'
              - 'scripts/bootstrap-tf-backend.sh'

      - id: flags
        env:
          FORCE: ${{ needs.config.outputs.force }}
          IS_PR: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          F_SHARED: ${{ steps.filter.outputs.shared || 'false' }}
          F_TOOLCHAIN: ${{ steps.filter.outputs.toolchain || 'false' }}
          F_SCHEMAS: ${{ steps.filter.outputs.schemas || 'false' }}
          F_UI: ${{ steps.filter.outputs.ui || 'false' }}
          F_ETL: ${{ steps.filter.outputs.etl || 'false' }}
          F_API: ${{ steps.filter.outputs.api || 'false' }}
          F_CLIENT: ${{ steps.filter.outputs.client || 'false' }}
          F_ADMIN: ${{ steps.filter.outputs.admin || 'false' }}
          F_INFRA: ${{ steps.filter.outputs.infra || 'false' }}
        run: |
          set -euo pipefail
          true_if() { [ "$1" = "true" ] && echo true || echo false; }
          or() {
            for v in "$@"; do
              if [ "$v" = "true" ]; then echo true; return; fi
            done
            echo false
          }

          # Release runs after CI, so detect a likely SemVer bump here to force API CI.
          # Deploy still keys off path flags plus needs.release.outputs.bumped.
          WILL_BUMP=false
          if [ "$FORCE" != "true" ] && [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            HEAD_MSG=$(git log -1 --pretty=%s)
            case "$HEAD_MSG" in
              'chore(release):'*) ;;
              *)
                LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)
                if [ -n "${LAST_TAG}" ]; then
                  SUBJECTS=$(git log "${LAST_TAG}..HEAD" --pretty=%s)
                  BODIES=$(git log "${LAST_TAG}..HEAD" --pretty=%B)
                  if printf '%s\n' "$SUBJECTS" | grep -Eiq '^(feat|fix)(\(.*\))?(!)?:' \
                    || printf '%s\n' "$BODIES" | grep -Fq 'BREAKING CHANGE:'; then
                    WILL_BUMP=true
                  fi
                fi
                ;;
            esac
          fi

          if [ "$FORCE" = "true" ]; then
            SHARED=true; SCHEMAS=true; UI=true; ETL=true; API=true; CLIENT=true; ADMIN=true; INFRA=true
            DEPLOY_API=true; DEPLOY_CLIENT=true; DEPLOY_ADMIN=true
          else
            SHARED=$(or "$F_SHARED" "$F_TOOLCHAIN" "$IS_PR")
            SCHEMAS=$(or "$F_SCHEMAS" "$F_TOOLCHAIN")
            UI=$(or "$F_UI" "$F_TOOLCHAIN")
            ETL=$(or "$F_ETL" "$F_SCHEMAS" "$F_TOOLCHAIN")
            API=$(or "$F_API" "$F_ETL" "$F_SCHEMAS" "$F_TOOLCHAIN" "$WILL_BUMP")
            CLIENT=$(or "$F_CLIENT" "$F_SCHEMAS" "$F_UI" "$F_TOOLCHAIN")
            ADMIN=$(or "$F_ADMIN" "$F_SCHEMAS" "$F_UI" "$F_TOOLCHAIN")
            INFRA=$(true_if "$F_INFRA")
            # Infra changes may replace EC2 / CDN; redeploy affected surfaces.
            DEPLOY_API=$(or "$F_API" "$F_ETL" "$F_SCHEMAS" "$F_TOOLCHAIN" "$INFRA")
            DEPLOY_CLIENT=$(or "$CLIENT" "$INFRA")
            DEPLOY_ADMIN=$(or "$ADMIN" "$INFRA")
          fi

          {
            echo "shared=${SHARED}"
            echo "schemas=${SCHEMAS}"
            echo "ui=${UI}"
            echo "etl=${ETL}"
            echo "api=${API}"
            echo "client=${CLIENT}"
            echo "admin=${ADMIN}"
            echo "infra=${INFRA}"
            echo "deploy_api=${DEPLOY_API}"
            echo "deploy_client=${DEPLOY_CLIENT}"
            echo "deploy_admin=${DEPLOY_ADMIN}"
          } >> "$GITHUB_OUTPUT"

          echo "Jobs shared=${SHARED} schemas=${SCHEMAS} ui=${UI} etl=${ETL} api=${API} client=${CLIENT} admin=${ADMIN} infra=${INFRA}"

  shared:
    name: Shared
    if: needs.changes.outputs.shared == 'true'
    needs: [config, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-js
        with:
          node-version: ${{ env.NODE_VERSION }}
          task-version: ${{ env.TASK_VERSION }}

      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | task commitlint:title

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: task commitlint BASE=${{ github.event.pull_request.base.sha }} TO=${{ github.event.pull_request.head.sha }}

      - name: Format-check and lint root / docs / scripts
        run: task shared:ci

  schemas:
    name: Build schemas
    if: needs.changes.outputs.schemas == 'true'
    needs: [config, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - uses: ./.github/actions/setup-js
        with:
          node-version: ${{ env.NODE_VERSION }}
          task-version: ${{ env.TASK_VERSION }}

      - name: Format, lint, and build schemas
        run: task schemas:ci

  ui:
    name: Build ui
    if: needs.changes.outputs.ui == 'true'
    needs: [config, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - uses: ./.github/actions/setup-js
        with:
          node-version: ${{ env.NODE_VERSION }}
          task-version: ${{ env.TASK_VERSION }}

      - name: Format, lint, and build ui
        run: task ui:ci

  etl:
    name: Build etl
    if: needs.changes.outputs.etl == 'true'
    needs: [config, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - uses: ./.github/actions/setup-js
        with:
          node-version: ${{ env.NODE_VERSION }}
          task-version: ${{ env.TASK_VERSION }}

      - name: Format, lint, test, and build etl
        run: task etl:ci

  api:
    name: Build API
    if: needs.changes.outputs.api == 'true'
    needs: [config, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - uses: ./.github/actions/setup-js
        with:
          node-version: ${{ env.NODE_VERSION }}
          task-version: ${{ env.TASK_VERSION }}

      - name: Format, lint, test, and build API
        run: task api:ci

  client:
    name: Build client
    if: needs.changes.outputs.client == 'true'
    needs: [config, changes]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - uses: ./.github/actions/setup-js
        with:
          node-version: ${{ env.NODE_VERSION }}
          task-version: ${{ env.TASK_VERSION }}

      - name: Format, lint, and build client
        env:
          VITE_API_URL: ${{ vars.COMPILE_CHECK_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: task client:ci

  admin:
    name: Build admin
    if: needs.changes.outputs.admin == 'true'
    needs: [config, changes]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - uses: ./.github/actions/setup-js
        with:
          node-version: ${{ env.NODE_VERSION }}
          task-version: ${{ env.TASK_VERSION }}

      - name: Format, lint, and build admin
        env:
          VITE_API_URL: ${{ vars.COMPILE_CHECK_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: task admin:ci

  infra:
    name: Build infra
    if: needs.changes.outputs.infra == 'true'
    needs: [config, changes]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Format-check and validate Terraform
        run: task infra:ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform plan (task infra:plan)
        run: task infra:plan ENV=${{ needs.config.outputs.environment }}

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.config.outputs.environment }}
          path: infra/envs/${{ needs.config.outputs.environment }}/tfplan
          if-no-files-found: error
          retention-days: 5

  release:
    name: Version & changelog
    if: |
      always() &&
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      needs.changes.result == 'success' &&
      (needs.shared.result == 'success' || needs.shared.result == 'skipped') &&
      (needs.schemas.result == 'success' || needs.schemas.result == 'skipped') &&
      (needs.ui.result == 'success' || needs.ui.result == 'skipped') &&
      (needs.etl.result == 'success' || needs.etl.result == 'skipped') &&
      (needs.api.result == 'success' || needs.api.result == 'skipped') &&
      (needs.client.result == 'success' || needs.client.result == 'skipped') &&
      (needs.admin.result == 'success' || needs.admin.result == 'skipped') &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    needs: [changes, shared, schemas, ui, etl, api, client, admin, infra]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      bumped: ${{ steps.sha.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup-js
        with:
          node-version: ${{ env.NODE_VERSION }}
          task-version: ${{ env.TASK_VERSION }}

      - name: Bump, changelog, tag, GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: task release

      - id: sha
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          if [ "${SHA}" = "${{ needs.changes.outputs.sha }}" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

  apply:
    name: Deploy infra
    if: |
      always() &&
      !cancelled() &&
      needs.config.outputs.deploy == 'true' &&
      needs.changes.outputs.infra == 'true' &&
      needs.infra.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (needs.shared.result == 'success' || needs.shared.result == 'skipped') &&
      (needs.schemas.result == 'success' || needs.schemas.result == 'skipped') &&
      (needs.ui.result == 'success' || needs.ui.result == 'skipped') &&
      (needs.etl.result == 'success' || needs.etl.result == 'skipped') &&
      (needs.api.result == 'success' || needs.api.result == 'skipped') &&
      (needs.client.result == 'success' || needs.client.result == 'skipped') &&
      (needs.admin.result == 'success' || needs.admin.result == 'skipped')
    needs: [config, changes, shared, schemas, ui, etl, api, client, admin, infra, release]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha || needs.changes.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.config.outputs.environment }}
          path: infra/envs/${{ needs.config.outputs.environment }}

      - name: Terraform apply (task infra:apply)
        run: task infra:apply ENV=${{ needs.config.outputs.environment }}

  deploy-api:
    name: Deploy API
    if: |
      always() &&
      !cancelled() &&
      needs.config.outputs.deploy == 'true' &&
      (needs.changes.outputs.deploy_api == 'true' || needs.release.outputs.bumped == 'true') &&
      (needs.apply.result == 'success' || needs.apply.result == 'skipped') &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (needs.shared.result == 'success' || needs.shared.result == 'skipped') &&
      (needs.schemas.result == 'success' || needs.schemas.result == 'skipped') &&
      (needs.ui.result == 'success' || needs.ui.result == 'skipped') &&
      (needs.etl.result == 'success' || needs.etl.result == 'skipped') &&
      (needs.api.result == 'success' || needs.api.result == 'skipped') &&
      (needs.client.result == 'success' || needs.client.result == 'skipped') &&
      (needs.admin.result == 'success' || needs.admin.result == 'skipped') &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    needs: [config, changes, shared, schemas, ui, etl, api, client, admin, infra, release, apply]
    # Native arm64 so linux/arm64 npm ci is not QEMU-emulated (SIGILL on Node 22/Alpine).
    runs-on: ubuntu-24.04-arm
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha || needs.changes.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Terraform init (outputs for deploy)
        run: task infra:init ENV=${{ needs.config.outputs.environment }}

      - name: Deploy API (task api:deploy)
        run: >
          task api:deploy
          ENV=${{ needs.config.outputs.environment }}
          API_IMAGE_TAG=${{ needs.release.outputs.sha || needs.changes.outputs.sha }}
          DOCKER_BUILDX=1

  deploy-client:
    name: Deploy client
    if: |
      always() &&
      !cancelled() &&
      needs.config.outputs.deploy == 'true' &&
      needs.changes.outputs.deploy_client == 'true' &&
      (needs.apply.result == 'success' || needs.apply.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (needs.client.result == 'success' || needs.client.result == 'skipped') &&
      (needs.shared.result == 'success' || needs.shared.result == 'skipped') &&
      (needs.schemas.result == 'success' || needs.schemas.result == 'skipped') &&
      (needs.ui.result == 'success' || needs.ui.result == 'skipped') &&
      (needs.etl.result == 'success' || needs.etl.result == 'skipped') &&
      (needs.api.result == 'success' || needs.api.result == 'skipped') &&
      (needs.admin.result == 'success' || needs.admin.result == 'skipped') &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    needs:
      [
        config,
        changes,
        shared,
        schemas,
        ui,
        etl,
        api,
        client,
        admin,
        infra,
        release,
        apply,
        deploy-api,
      ]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha || needs.changes.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/setup-js
        with:
          node-version: ${{ env.NODE_VERSION }}
          task-version: ${{ env.TASK_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init (outputs for deploy)
        run: task infra:init ENV=${{ needs.config.outputs.environment }}

      - name: Deploy client (task client:deploy)
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: task client:deploy ENV=${{ needs.config.outputs.environment }}

  deploy-admin:
    name: Deploy admin
    if: |
      always() &&
      !cancelled() &&
      needs.config.outputs.deploy == 'true' &&
      needs.changes.outputs.deploy_admin == 'true' &&
      (needs.apply.result == 'success' || needs.apply.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (needs.admin.result == 'success' || needs.admin.result == 'skipped') &&
      (needs.shared.result == 'success' || needs.shared.result == 'skipped') &&
      (needs.schemas.result == 'success' || needs.schemas.result == 'skipped') &&
      (needs.ui.result == 'success' || needs.ui.result == 'skipped') &&
      (needs.etl.result == 'success' || needs.etl.result == 'skipped') &&
      (needs.api.result == 'success' || needs.api.result == 'skipped') &&
      (needs.client.result == 'success' || needs.client.result == 'skipped') &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    needs:
      [
        config,
        changes,
        shared,
        schemas,
        ui,
        etl,
        api,
        client,
        admin,
        infra,
        release,
        apply,
        deploy-api,
      ]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha || needs.changes.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/setup-js
        with:
          node-version: ${{ env.NODE_VERSION }}
          task-version: ${{ env.TASK_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init (outputs for deploy)
        run: task infra:init ENV=${{ needs.config.outputs.environment }}

      - name: Deploy admin (task admin:deploy)
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: task admin:deploy ENV=${{ needs.config.outputs.environment }}
