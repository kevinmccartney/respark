name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (must match infra/envs/<name> and a GitHub Environment)
        type: choice
        options:
          - develop
          - production
        default: develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.environment || 'develop' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '22'
  TERRAFORM_VERSION: '1.9.8'
  TASK_VERSION: '3.x'

jobs:
  config:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
      deploy: ${{ steps.set.outputs.deploy }}
      force: ${{ steps.set.outputs.force }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
            # Manual runs always rebuild/redeploy everything for the chosen env.
            FORCE=true
          else
            # PRs and pushes to main always target develop.
            ENV="develop"
            FORCE=false
          fi

          DEPLOY=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] && {
            [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]
          }; then
            DEPLOY=true
          fi

          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
          echo "deploy=${DEPLOY}" >> "$GITHUB_OUTPUT"
          echo "force=${FORCE}" >> "$GITHUB_OUTPUT"
          echo "Resolved ENV=${ENV} deploy=${DEPLOY} force=${FORCE}"

  format:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install dependencies
        run: task install

      - name: Check formatting (task format:check)
        run: task format:check

      - name: Lint (task lint)
        run: task lint

  changes:
    name: Detect changes
    needs: [config]
    runs-on: ubuntu-latest
    outputs:
      etl: ${{ steps.flags.outputs.etl }}
      api: ${{ steps.flags.outputs.api }}
      web: ${{ steps.flags.outputs.web }}
      admin: ${{ steps.flags.outputs.admin }}
      infra: ${{ steps.flags.outputs.infra }}
      build: ${{ steps.flags.outputs.build }}
      deploy_api: ${{ steps.flags.outputs.deploy_api }}
      deploy_web: ${{ steps.flags.outputs.deploy_web }}
      deploy_admin: ${{ steps.flags.outputs.deploy_admin }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: needs.config.outputs.force != 'true'
        with:
          filters: |
            shared:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'Taskfile.yml'
            schemas:
              - 'packages/schemas/**'
            etl:
              - 'apps/etl/**'
            api:
              - 'apps/api/**'
              - 'scripts/redeploy-api-ec2.sh'
              - 'scripts/push-api-secrets.sh'
            web:
              - 'apps/web/**'
            admin:
              - 'apps/admin/**'
            infra:
              - 'infra/**'
              - 'scripts/bootstrap-tf-backend.sh'

      - id: flags
        env:
          FORCE: ${{ needs.config.outputs.force }}
          F_SHARED: ${{ steps.filter.outputs.shared || 'false' }}
          F_SCHEMAS: ${{ steps.filter.outputs.schemas || 'false' }}
          F_ETL: ${{ steps.filter.outputs.etl || 'false' }}
          F_API: ${{ steps.filter.outputs.api || 'false' }}
          F_WEB: ${{ steps.filter.outputs.web || 'false' }}
          F_ADMIN: ${{ steps.filter.outputs.admin || 'false' }}
          F_INFRA: ${{ steps.filter.outputs.infra || 'false' }}
        run: |
          set -euo pipefail
          true_if() { [ "$1" = "true" ] && echo true || echo false; }
          or() {
            for v in "$@"; do
              if [ "$v" = "true" ]; then echo true; return; fi
            done
            echo false
          }

          if [ "$FORCE" = "true" ]; then
            ETL=true; API=true; WEB=true; ADMIN=true; INFRA=true
          else
            ETL=$(or "$F_ETL" "$F_SHARED")
            # API image includes etl + schemas; treat those as API build/deploy.
            API=$(or "$F_API" "$F_ETL" "$F_SCHEMAS" "$F_SHARED")
            WEB=$(or "$F_WEB" "$F_SCHEMAS" "$F_SHARED")
            ADMIN=$(or "$F_ADMIN" "$F_SCHEMAS" "$F_SHARED")
            INFRA=$(true_if "$F_INFRA")
          fi

          BUILD=$(or "$ETL" "$API" "$WEB" "$ADMIN")
          # Infra changes may replace EC2 / CDN; redeploy affected surfaces.
          DEPLOY_API=$(or "$API" "$INFRA")
          DEPLOY_WEB=$(or "$WEB" "$INFRA")
          DEPLOY_ADMIN=$(or "$ADMIN" "$INFRA")

          {
            echo "etl=${ETL}"
            echo "api=${API}"
            echo "web=${WEB}"
            echo "admin=${ADMIN}"
            echo "infra=${INFRA}"
            echo "build=${BUILD}"
            echo "deploy_api=${DEPLOY_API}"
            echo "deploy_web=${DEPLOY_WEB}"
            echo "deploy_admin=${DEPLOY_ADMIN}"
          } >> "$GITHUB_OUTPUT"

          echo "Changes etl=${ETL} api=${API} web=${WEB} admin=${ADMIN} infra=${INFRA} build=${BUILD}"

  build:
    name: Build apps
    if: needs.changes.outputs.build == 'true'
    needs: [config, changes, format]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install dependencies
        run: task install

      - name: Build etl
        if: needs.changes.outputs.etl == 'true'
        run: task etl:build

      - name: Build API
        if: needs.changes.outputs.api == 'true'
        run: task api:build

      - name: Build web
        if: needs.changes.outputs.web == 'true'
        env:
          # Compile-time check only; deploy jobs rebuild with live api_url from Terraform.
          VITE_API_URL: ${{ vars.COMPILE_CHECK_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: task web:build

      - name: Build admin
        if: needs.changes.outputs.admin == 'true'
        env:
          VITE_API_URL: ${{ vars.COMPILE_CHECK_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: task admin:build

  plan:
    name: Plan infra
    if: needs.changes.outputs.infra == 'true'
    needs: [config, changes, format]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Terraform plan (task infra:plan)
        run: task infra:plan ENV=${{ needs.config.outputs.environment }}

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.config.outputs.environment }}
          path: infra/envs/${{ needs.config.outputs.environment }}/tfplan
          if-no-files-found: error
          retention-days: 5

  apply:
    name: Apply infra
    if: |
      always() &&
      !cancelled() &&
      needs.config.outputs.deploy == 'true' &&
      needs.changes.outputs.infra == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.plan.result == 'success'
    needs: [config, changes, build, plan]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.config.outputs.environment }}
          path: infra/envs/${{ needs.config.outputs.environment }}

      - name: Terraform apply (task infra:apply)
        run: task infra:apply ENV=${{ needs.config.outputs.environment }}

  deploy-api:
    name: Deploy API
    if: |
      always() &&
      !cancelled() &&
      needs.config.outputs.deploy == 'true' &&
      needs.changes.outputs.deploy_api == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    needs: [config, changes, build, apply]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Terraform init (outputs for deploy)
        run: task infra:init ENV=${{ needs.config.outputs.environment }}

      - name: Deploy API (task api:deploy)
        run: >
          task api:deploy
          ENV=${{ needs.config.outputs.environment }}
          API_IMAGE_TAG=${{ github.sha }}
          DOCKER_BUILDX=1

  deploy-web:
    name: Deploy web
    if: |
      always() &&
      !cancelled() &&
      needs.config.outputs.deploy == 'true' &&
      needs.changes.outputs.deploy_web == 'true' &&
      (needs.apply.result == 'success' || needs.apply.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    needs: [config, changes, apply, deploy-api]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install dependencies
        run: task install

      - name: Terraform init (outputs for deploy)
        run: task infra:init ENV=${{ needs.config.outputs.environment }}

      - name: Deploy web (task web:deploy)
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: task web:deploy ENV=${{ needs.config.outputs.environment }}

  deploy-admin:
    name: Deploy admin
    if: |
      always() &&
      !cancelled() &&
      needs.config.outputs.deploy == 'true' &&
      needs.changes.outputs.deploy_admin == 'true' &&
      (needs.apply.result == 'success' || needs.apply.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    needs: [config, changes, apply, deploy-api]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install dependencies
        run: task install

      - name: Terraform init (outputs for deploy)
        run: task infra:init ENV=${{ needs.config.outputs.environment }}

      - name: Deploy admin (task admin:deploy)
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: task admin:deploy ENV=${{ needs.config.outputs.environment }}
