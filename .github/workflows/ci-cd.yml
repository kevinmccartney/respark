name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (must match infra/envs/<name> and a GitHub Environment)
        type: choice
        options:
          - develop
          - production
        default: develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.environment || 'develop' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '22'
  TERRAFORM_VERSION: '1.9.8'
  TASK_VERSION: '3.x'

jobs:
  config:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
      deploy: ${{ steps.set.outputs.deploy }}
      force: ${{ steps.set.outputs.force }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
            # Manual runs always rebuild/redeploy everything for the chosen env.
            FORCE=true
          else
            # PRs and pushes to main always target develop.
            ENV="develop"
            FORCE=false
          fi

          DEPLOY=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] && {
            [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]
          }; then
            DEPLOY=true
          fi

          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
          echo "deploy=${DEPLOY}" >> "$GITHUB_OUTPUT"
          echo "force=${FORCE}" >> "$GITHUB_OUTPUT"
          echo "Resolved ENV=${ENV} deploy=${DEPLOY} force=${FORCE}"

  format:
    name: Format & lint
    needs: [config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install dependencies
        run: task install

      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | task commitlint:title

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: task commitlint BASE=${{ github.event.pull_request.base.sha }} TO=${{ github.event.pull_request.head.sha }}

      - name: Check formatting (task format:check)
        run: task format:check

      - name: Lint (task lint)
        run: task lint

      - name: Test (task test)
        run: task test

  release:
    name: Version & changelog
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    needs: [format]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      bumped: ${{ steps.sha.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install dependencies
        run: task install

      - name: Bump, changelog, tag, GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: task release

      - id: sha
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          if [ "${SHA}" = "${{ github.sha }}" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

  changes:
    name: Detect changes
    if: |
      always() &&
      !cancelled() &&
      needs.config.result == 'success' &&
      needs.format.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    needs: [config, format, release]
    runs-on: ubuntu-latest
    outputs:
      etl: ${{ steps.flags.outputs.etl }}
      api: ${{ steps.flags.outputs.api }}
      client: ${{ steps.flags.outputs.client }}
      admin: ${{ steps.flags.outputs.admin }}
      infra: ${{ steps.flags.outputs.infra }}
      build: ${{ steps.flags.outputs.build }}
      deploy_api: ${{ steps.flags.outputs.deploy_api }}
      deploy_client: ${{ steps.flags.outputs.deploy_client }}
      deploy_admin: ${{ steps.flags.outputs.deploy_admin }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - id: ref
        run: echo "sha=${{ needs.release.outputs.sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - uses: dorny/paths-filter@v3
        id: filter
        if: needs.config.outputs.force != 'true'
        with:
          filters: |
            shared:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'Taskfile.yml'
            schemas:
              - 'packages/schemas/**'
            ui:
              - 'packages/ui/**'
            etl:
              - 'apps/etl/**'
            api:
              - 'apps/api/**'
              - 'scripts/redeploy-api-ec2.sh'
              - 'scripts/push-api-secrets.sh'
            client:
              - 'apps/client/**'
            admin:
              - 'apps/admin/**'
            infra:
              - 'infra/**'
              - 'scripts/bootstrap-tf-backend.sh'

      - id: flags
        env:
          FORCE: ${{ needs.config.outputs.force }}
          BUMPED: ${{ needs.release.outputs.bumped || 'false' }}
          F_SHARED: ${{ steps.filter.outputs.shared || 'false' }}
          F_SCHEMAS: ${{ steps.filter.outputs.schemas || 'false' }}
          F_UI: ${{ steps.filter.outputs.ui || 'false' }}
          F_ETL: ${{ steps.filter.outputs.etl || 'false' }}
          F_API: ${{ steps.filter.outputs.api || 'false' }}
          F_CLIENT: ${{ steps.filter.outputs.client || 'false' }}
          F_ADMIN: ${{ steps.filter.outputs.admin || 'false' }}
          F_INFRA: ${{ steps.filter.outputs.infra || 'false' }}
        run: |
          set -euo pipefail
          true_if() { [ "$1" = "true" ] && echo true || echo false; }
          or() {
            for v in "$@"; do
              if [ "$v" = "true" ]; then echo true; return; fi
            done
            echo false
          }

          if [ "$FORCE" = "true" ]; then
            ETL=true; API=true; CLIENT=true; ADMIN=true; INFRA=true
          else
            ETL=$(or "$F_ETL" "$F_SHARED")
            # API image includes etl + schemas; treat those as API build/deploy.
            # A platform version bump must redeploy API so GET /info serves the new version.
            API=$(or "$F_API" "$F_ETL" "$F_SCHEMAS" "$F_SHARED" "$BUMPED")
            CLIENT=$(or "$F_CLIENT" "$F_SCHEMAS" "$F_UI" "$F_SHARED")
            ADMIN=$(or "$F_ADMIN" "$F_SCHEMAS" "$F_UI" "$F_SHARED")
            INFRA=$(true_if "$F_INFRA")
          fi

          BUILD=$(or "$ETL" "$API" "$CLIENT" "$ADMIN")
          # Infra changes may replace EC2 / CDN; redeploy affected surfaces.
          DEPLOY_API=$(or "$API" "$INFRA")
          DEPLOY_CLIENT=$(or "$CLIENT" "$INFRA")
          DEPLOY_ADMIN=$(or "$ADMIN" "$INFRA")

          {
            echo "etl=${ETL}"
            echo "api=${API}"
            echo "client=${CLIENT}"
            echo "admin=${ADMIN}"
            echo "infra=${INFRA}"
            echo "build=${BUILD}"
            echo "deploy_api=${DEPLOY_API}"
            echo "deploy_client=${DEPLOY_CLIENT}"
            echo "deploy_admin=${DEPLOY_ADMIN}"
          } >> "$GITHUB_OUTPUT"

          echo "Changes etl=${ETL} api=${API} client=${CLIENT} admin=${ADMIN} infra=${INFRA} build=${BUILD}"

  build:
    name: Build apps
    if: needs.changes.outputs.build == 'true'
    needs: [config, changes, format]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install dependencies
        run: task install

      - name: Build etl
        if: needs.changes.outputs.etl == 'true'
        run: task etl:build

      - name: Build API
        if: needs.changes.outputs.api == 'true'
        run: task api:build

      - name: Build client
        if: needs.changes.outputs.client == 'true'
        env:
          # Compile-time check only; deploy jobs rebuild with live api_url from Terraform.
          VITE_API_URL: ${{ vars.COMPILE_CHECK_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: task client:build

      - name: Build admin
        if: needs.changes.outputs.admin == 'true'
        env:
          VITE_API_URL: ${{ vars.COMPILE_CHECK_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: task admin:build

  plan:
    name: Plan infra
    if: needs.changes.outputs.infra == 'true'
    needs: [config, changes, format]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Terraform plan (task infra:plan)
        run: task infra:plan ENV=${{ needs.config.outputs.environment }}

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.config.outputs.environment }}
          path: infra/envs/${{ needs.config.outputs.environment }}/tfplan
          if-no-files-found: error
          retention-days: 5

  apply:
    name: Apply infra
    if: |
      always() &&
      !cancelled() &&
      needs.config.outputs.deploy == 'true' &&
      needs.changes.outputs.infra == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.plan.result == 'success'
    needs: [config, changes, build, plan]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.config.outputs.environment }}
          path: infra/envs/${{ needs.config.outputs.environment }}

      - name: Terraform apply (task infra:apply)
        run: task infra:apply ENV=${{ needs.config.outputs.environment }}

  deploy-api:
    name: Deploy API
    if: |
      always() &&
      !cancelled() &&
      needs.config.outputs.deploy == 'true' &&
      needs.changes.outputs.deploy_api == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    needs: [config, changes, build, apply]
    # Native arm64 so linux/arm64 npm ci is not QEMU-emulated (SIGILL on Node 22/Alpine).
    runs-on: ubuntu-24.04-arm
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Terraform init (outputs for deploy)
        run: task infra:init ENV=${{ needs.config.outputs.environment }}

      - name: Deploy API (task api:deploy)
        run: >
          task api:deploy
          ENV=${{ needs.config.outputs.environment }}
          API_IMAGE_TAG=${{ needs.changes.outputs.sha }}
          DOCKER_BUILDX=1

  deploy-client:
    name: Deploy client
    if: |
      always() &&
      !cancelled() &&
      needs.config.outputs.deploy == 'true' &&
      needs.changes.outputs.deploy_client == 'true' &&
      (needs.apply.result == 'success' || needs.apply.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    needs: [config, changes, apply, deploy-api]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install dependencies
        run: task install

      - name: Terraform init (outputs for deploy)
        run: task infra:init ENV=${{ needs.config.outputs.environment }}

      - name: Deploy client (task client:deploy)
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: task client:deploy ENV=${{ needs.config.outputs.environment }}

  deploy-admin:
    name: Deploy admin
    if: |
      always() &&
      !cancelled() &&
      needs.config.outputs.deploy == 'true' &&
      needs.changes.outputs.deploy_admin == 'true' &&
      (needs.apply.result == 'success' || needs.apply.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    needs: [config, changes, apply, deploy-api]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install dependencies
        run: task install

      - name: Terraform init (outputs for deploy)
        run: task infra:init ENV=${{ needs.config.outputs.environment }}

      - name: Deploy admin (task admin:deploy)
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: task admin:deploy ENV=${{ needs.config.outputs.environment }}
